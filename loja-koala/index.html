<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos – Koala Supermercados</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="css/estilos.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<header id="cabecalho"></header>

<main id="main">
  <div class="container">
    <h1 class="sobre-fundo">Nossos produtos</h1>
    <div class="grade" id="cats"></div>

    <section style="margin-top: var(--espaco-16)">
      <div class="secao-topo">
        <h2>Ofertas do dia</h2>
        <span>Terminam em <span class="cronometro" id="cronometro"><b>00</b>:<b>00</b>:<b>00</b></span></span>
        <a href="promocoes.html">Ver todas as promoções</a>
      </div>
      <div class="grade-produtos" id="ofertas"></div>
    </section>

    <section class="faixa-loja" aria-label="Nossa loja">
      <img src="img/fotos/loja.jpg" alt="Corredor de um supermercado com prateleiras abastecidas">
      <div><h2>Tudo pra você, todos os dias</h2><p>Hortifrúti, açougue, padaria e mais de mil produtos para a sua lista.</p></div>
    </section>

    <section id="dicas" style="margin-top: var(--espaco-10)">
      <h2 class="sobre-fundo">Dicas Koala</h2>
      <div class="dicas" id="dicas-lista"></div>
    </section>

    <section>
      <div class="painel" style="max-width: 520px">
        <h2>Receba o encarte por e-mail</h2>
        <form id="news" novalidate>
          <div class="campo">
            <label for="email">Seu e-mail</label>
            <input id="email" type="email" autocomplete="email" aria-describedby="email-erro">
            <div class="campo__erro" id="email-erro" hidden></div>
          </div>
          <button class="botao" type="submit">Quero receber</button>
          <div class="aviso aviso--sucesso" id="news-ok" hidden style="margin-top: var(--espaco-3)">Pronto! Você vai receber o encarte da semana.</div>
        </form>
      </div>
    </section>
  </div>
</main>

<footer id="rodape"></footer>
<script>
(() => {
  const { $, cardProduto } = Koala;
  const cards = CATS.map(c => `<a class="card" href="produtos.html?cat=${c.slug}"><img src="${c.img}" alt=""><span>${c.name}</span></a>`);
  // as duas últimas categorias ocupam a linha final, como no layout de referência
  $("#cats").innerHTML = cards.slice(0, 12).join("") + `<div class="grade__larga">${cards.slice(12).join("")}</div>`;

  PRODUCTS.filter(p => p.old).slice(0, 4).forEach(p => $("#ofertas").appendChild(cardProduto(p)));
  $("#dicas-lista").innerHTML = TIPS.map(t => `<article class="painel"><h3>${t.t}</h3><p>${t.d}</p></article>`).join("");

  // contagem regressiva até a meia-noite
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const agora = new Date(), fim = new Date(agora); fim.setHours(24, 0, 0, 0);
    const s = Math.floor((fim - agora) / 1000), b = document.querySelectorAll("#cronometro b");
    b[0].textContent = pad(Math.floor(s / 3600)); b[1].textContent = pad(Math.floor(s % 3600 / 60)); b[2].textContent = pad(s % 60);
  }
  tick(); setInterval(tick, 1000);

  $("#news").addEventListener("submit", e => {
    e.preventDefault();
    const inp = $("#email"), msg = $("#email-erro"), v = inp.value.trim();
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    inp.setAttribute("aria-invalid", !ok);
    msg.hidden = ok; msg.textContent = v ? "Digite um e-mail válido, como nome@exemplo.com." : "Informe seu e-mail.";
    $("#news-ok").hidden = !ok;
    if (!ok) inp.focus(); else inp.value = "";
  });
})();
</script>
</body>
</html>
