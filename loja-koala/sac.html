<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAC – Koala Supermercados</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="css/estilos.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<header id="cabecalho"></header>
<main id="main"><div class="container" style="max-width: 700px">
  <h1 class="sobre-fundo">Fale com a Koala</h1>
  <div class="painel abas">
    <div role="tablist" aria-label="Atendimento">
      <button role="tab" id="t-sac" aria-selected="true" aria-controls="p-sac" type="button">SAC</button>
      <button role="tab" id="t-den" aria-selected="false" aria-controls="p-den" type="button" tabindex="-1">Canal de denúncias</button>
    </div>
    <div role="tabpanel" id="p-sac" aria-labelledby="t-sac"><form class="f" novalidate data-tipo="mensagem"></form></div>
    <div role="tabpanel" id="p-den" aria-labelledby="t-den" hidden><form class="f" novalidate data-tipo="denúncia"></form></div>
  </div>
</div></main>
<footer id="rodape"></footer>
<script>
(() => {
  const { $, $$ } = Koala;
  const modelo = anon => `
    ${anon ? '<p class="campo__ajuda">Você pode enviar de forma anônima. Nesse caso, nome e e-mail são opcionais.</p><label class="marcar" style="margin-bottom: var(--espaco-4)"><input type="checkbox" name="anon"> Enviar anonimamente</label>' : ""}
    <div class="campo"><label>Nome</label><input name="nome" autocomplete="name"><div class="campo__erro" hidden></div></div>
    <div class="campo"><label>E-mail</label><input name="email" type="email" autocomplete="email"><div class="campo__erro" hidden></div></div>
    <div class="campo"><label>Assunto</label><select name="assunto"><option value="">Selecione</option>
      ${(anon ? ["Conduta de funcionário", "Fraude", "Segurança dos alimentos", "Outro"] : ["Dúvida", "Elogio", "Reclamação", "Sugestão"]).map(o => `<option>${o}</option>`).join("")}</select><div class="campo__erro" hidden></div></div>
    <div class="campo"><label>Mensagem</label><textarea name="msg" rows="5" maxlength="500"></textarea><span class="campo__ajuda"><span class="c">0</span>/500 — mínimo de 10 caracteres</span><div class="campo__erro" hidden></div></div>
    <button class="botao" type="submit">Enviar</button>
    <div class="aviso aviso--sucesso" hidden style="margin-top: var(--espaco-4)"></div>`;

  $$(".f").forEach((f, i) => {
    f.innerHTML = modelo(i === 1);
    ["nome", "email", "assunto", "msg"].forEach(n => { const el = f.elements[n]; el.id = "f" + i + "-" + n; el.closest(".campo").querySelector("label").htmlFor = el.id; });
    f.elements.msg.addEventListener("input", () => $(".c", f).textContent = f.elements.msg.value.length);
    const regras = {
      nome: v => v.trim().length >= 2 || "Informe seu nome.",
      email: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) || "Digite um e-mail válido.",
      assunto: v => !!v || "Escolha um assunto.",
      msg: v => v.trim().length >= 10 || "Escreva ao menos 10 caracteres.",
    };
    f.addEventListener("submit", e => {
      e.preventDefault();
      const anon = f.elements.anon && f.elements.anon.checked;
      let primeiro = null;
      Object.keys(regras).forEach(n => {
        const el = f.elements[n], msg = el.closest(".campo").querySelector(".campo__erro");
        const r = anon && (n === "nome" || n === "email") ? true : regras[n](el.value);
        el.setAttribute("aria-invalid", r !== true);
        msg.hidden = r === true; msg.textContent = r === true ? "" : r;
        if (r !== true && !primeiro) primeiro = el;
      });
      const ok = $(".aviso", f);
      ok.hidden = !!primeiro;
      if (primeiro) { primeiro.focus(); return; }
      const btn = $(".botao", f); btn.classList.add("carregando"); btn.disabled = true;
      setTimeout(() => {
        btn.classList.remove("carregando"); btn.disabled = false;
        ok.textContent = "Recebemos sua " + f.dataset.tipo + ". Protocolo " + Math.random().toString(36).slice(2, 8).toUpperCase() + ".";
        ok.hidden = false; f.reset(); $(".c", f).textContent = 0;
      }, 800);
    });
  });

  // abas acessíveis (setas)
  const abas = $$("[role=tab]");
  function selecionar(t) {
    abas.forEach(x => { const on = x === t; x.setAttribute("aria-selected", on); x.tabIndex = on ? 0 : -1; $("#" + x.getAttribute("aria-controls")).hidden = !on; });
    t.focus();
  }
  abas.forEach((t, i) => {
    t.addEventListener("click", () => selecionar(t));
    t.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") selecionar(abas[(i + 1) % abas.length]);
      if (e.key === "ArrowLeft") selecionar(abas[(i - 1 + abas.length) % abas.length]);
    });
  });
  if (location.hash === "#denuncia") selecionar(abas[1]);
})();
</script>
</body>
</html>
