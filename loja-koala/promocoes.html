<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promoções – Koala Supermercados</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="css/estilos.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<header id="cabecalho"></header>
<main id="main"><div class="container">
  <h1 class="sobre-fundo">Promoções e encarte</h1>
  <p class="sobre-fundo">Ofertas da semana nas lojas Koala. Adicione à sua lista e economize.</p>
  <div class="barra-filtros"><div class="campo"><label class="sr-only" for="ordem">Ordenar</label>
    <select id="ordem"><option value="desc">Maior desconto</option><option value="menor">Menor preço</option><option value="nome">Nome (A–Z)</option></select></div></div>
  <div class="grade-produtos" id="grade"></div>
</div></main>
<footer id="rodape"></footer>
<script>
(() => {
  const { $, cardProduto } = Koala;
  const ofertas = PRODUCTS.filter(p => p.old), desc = p => 1 - p.price / p.old;
  function render() {
    const o = $("#ordem").value;
    ofertas.sort(o === "menor" ? (a, b) => a.price - b.price : o === "nome" ? (a, b) => a.name.localeCompare(b.name, "pt-BR") : (a, b) => desc(b) - desc(a));
    const g = $("#grade"); g.innerHTML = "";
    ofertas.forEach(p => g.appendChild(cardProduto(p)));
  }
  $("#ordem").addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
