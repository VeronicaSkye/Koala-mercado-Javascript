<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de componentes – Koala</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="css/estilos.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<header id="cabecalho"></header>
<main id="main"><div class="container">
  <h1 class="sobre-fundo">Catálogo de componentes</h1>
  <p class="sobre-fundo">Todos os componentes da Koala em todos os estados: normal, hover, foco, desabilitado, erro e tema escuro. Teste aqui, não em cada página. Hover e foco são forçados por classe para ficarem visíveis.</p>
  <div id="temas"></div>

  <template id="tpl">
    <div class="bloco"><h3>Cores (tokens.css)</h3>
      <div class="amostras">
        <div class="amostra" style="background: var(--cor-fundo); color: var(--cor-texto-fundo)">--cor-fundo</div>
        <div class="amostra" style="background: var(--cor-superficie); color: var(--cor-texto)">--cor-superficie</div>
        <div class="amostra" style="background: var(--cor-primaria); color: var(--cor-sobre-primaria)">--cor-primaria</div>
        <div class="amostra" style="background: var(--cor-card); color: var(--cor-sobre-card)">--cor-card</div>
        <div class="amostra" style="background: var(--cor-acento); color: var(--cor-sobre-acento)">--cor-acento</div>
        <div class="amostra" style="background: var(--cor-foco); color: var(--cor-preto)">--cor-foco</div>
        <div class="amostra" style="background: var(--cor-erro-fundo); color: var(--cor-erro)">--cor-erro</div>
        <div class="amostra" style="background: var(--cor-sucesso-fundo); color: var(--cor-sucesso)">--cor-sucesso</div>
      </div></div>

    <div class="bloco"><h3>.botao</h3><div class="estados">
      <figure><button class="botao" type="button">Adicionar</button><figcaption>Normal</figcaption></figure>
      <figure><button class="botao is-hover" type="button">Adicionar</button><figcaption>Hover</figcaption></figure>
      <figure><button class="botao is-foco" type="button">Adicionar</button><figcaption>Foco</figcaption></figure>
      <figure><button class="botao" type="button" disabled>Adicionar</button><figcaption>Desabilitado</figcaption></figure>
      <figure><button class="botao carregando" type="button">Enviando</button><figcaption>Carregando</figcaption></figure>
    </div></div>

    <div class="bloco"><h3>.botao--sec</h3><div class="estados">
      <figure><button class="botao botao--sec" type="button">Secundário</button><figcaption>Normal</figcaption></figure>
      <figure><button class="botao botao--sec is-hover" type="button">Secundário</button><figcaption>Hover</figcaption></figure>
      <figure><button class="botao botao--sec is-foco" type="button">Secundário</button><figcaption>Foco</figcaption></figure>
      <figure><button class="botao botao--sec" type="button" disabled>Secundário</button><figcaption>Desabilitado</figcaption></figure>
    </div></div>

    <div class="bloco"><h3>.campo</h3><div class="estados">
      <figure><div class="campo"><input placeholder="Nome do item" aria-label="Normal"></div><figcaption>Normal</figcaption></figure>
      <figure><div class="campo"><input class="is-hover" placeholder="Nome do item" aria-label="Hover"></div><figcaption>Hover</figcaption></figure>
      <figure><div class="campo"><input class="is-foco" value="Café" aria-label="Foco"></div><figcaption>Foco</figcaption></figure>
      <figure><div class="campo"><input value="Indisponível" disabled aria-label="Desabilitado"></div><figcaption>Desabilitado</figcaption></figure>
      <figure><div class="campo"><input aria-invalid="true" value="abc" aria-label="Erro"><div class="campo__erro">Digite um e-mail válido.</div></div><figcaption>Erro</figcaption></figure>
    </div></div>

    <div class="bloco"><h3>Caixa de marcar</h3><div class="estados">
      <figure><label class="marcar"><input type="checkbox"> Normal</label></figure>
      <figure><label class="marcar"><input type="checkbox" checked> Marcado</label></figure>
      <figure><label class="marcar"><input type="checkbox" disabled> Desabilitado</label></figure>
    </div></div>

    <div class="bloco"><h3>.card (categoria)</h3><div class="estados" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr))">
      <figure><a class="card" href="#"><img src="img/fotos/acougue.jpg" alt=""><span>Açougue</span></a><figcaption>Normal</figcaption></figure>
      <figure><a class="card is-hover" href="#"><img src="img/fotos/bebidas.jpg" alt=""><span>Bebidas</span></a><figcaption>Hover</figcaption></figure>
      <figure><a class="card is-foco" href="#"><img src="img/fotos/massas.jpg" alt=""><span>Massas</span></a><figcaption>Foco</figcaption></figure>
    </div></div>

    <div class="bloco"><h3>.card--vertical (produto)</h3><div class="estados" style="grid-template-columns: repeat(auto-fit, minmax(210px, 1fr))">
      <figure><article class="card card--vertical"><img src="img/fotos/cereais.jpg" alt=""><div class="card__corpo"><h3>Arroz Branco</h3><div class="card__mudo">5 kg</div><div class="preco">R$ 27,90</div><button class="botao" type="button">Adicionar à lista</button></div></article><figcaption>Normal</figcaption></figure>
      <figure><article class="card card--vertical"><span class="etiqueta">-12%</span><img src="img/fotos/cereais.jpg" alt=""><div class="card__corpo"><h3>Arroz Branco</h3><div class="card__mudo">5 kg</div><div class="preco"><s>R$ 31,90</s>R$ 27,90</div><button class="botao" type="button">Adicionar à lista</button></div></article><figcaption>Em promoção</figcaption></figure>
      <figure><article class="card card--vertical"><img src="img/fotos/cereais.jpg" alt=""><div class="card__corpo"><h3>Arroz Branco</h3><div class="card__mudo">5 kg</div><div class="preco">R$ 27,90</div><button class="botao" type="button" disabled>Indisponível</button></div></article><figcaption>Desabilitado</figcaption></figure>
    </div></div>

    <div class="bloco"><h3>.aviso e .toast</h3><div style="display: grid; gap: var(--espaco-2)">
      <div class="aviso">Informação: o encarte muda toda quinta-feira.</div>
      <div class="aviso aviso--sucesso">Sucesso: item adicionado à lista.</div>
      <div class="aviso aviso--erro">Erro: não foi possível enviar a mensagem.</div>
      <div><span class="toast" style="display: inline-block">Café adicionado à lista</span></div>
    </div></div>

    <div class="bloco"><h3>Item da lista</h3><ul class="itens" style="margin: 0">
      <li class="item"><input type="checkbox" aria-label="Marcar"><span class="nome">Café <small>500 g</small></span><span class="qtd"><button type="button">−</button><output>2</output><button type="button">+</button></span><span class="subtotal">R$ 35,80</span><button class="botao botao--sec" type="button">Remover</button></li>
      <li class="item item--feito"><input type="checkbox" checked aria-label="Marcar"><span class="nome">Leite <small>1 L</small></span><span class="qtd"><button type="button">−</button><output>6</output><button type="button">+</button></span><span class="subtotal">R$ 29,94</span><button class="botao botao--sec" type="button">Remover</button></li>
    </ul></div>
  </template>
</div></main>
<footer id="rodape"></footer>
<script>
(() => {
  const raiz = document.getElementById("temas"), tpl = document.getElementById("tpl");
  [["claro", "Tema claro"], ["escuro", "Tema escuro"]].forEach(([t, titulo]) => {
    const s = document.createElement("section");
    s.className = "escopo"; s.dataset.tema = t;
    s.innerHTML = `<h2>${titulo}</h2>`;
    s.appendChild(tpl.content.cloneNode(true));
    raiz.appendChild(s);
  });
})();
</script>
</body>
</html>
