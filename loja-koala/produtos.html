<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos – Koala Supermercados</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="css/estilos.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<header id="cabecalho"></header>
<main id="main"><div class="container">
  <h1 class="sobre-fundo" id="titulo">Produtos</h1>
  <div class="barra-filtros">
    <div class="campo"><label class="sr-only" for="q">Buscar produto</label><input id="q" type="search" placeholder="Buscar produto"></div>
    <div class="campo"><label class="sr-only" for="ordem">Ordenar</label>
      <select id="ordem"><option value="nome">Nome (A–Z)</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select></div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
  <p class="sobre-fundo" id="contagem" aria-live="polite"></p>
  <div class="grade-produtos" id="grade"></div>
  <div class="painel vazio" id="vazio" hidden><h2>Nenhum produto encontrado</h2><p>Tente outra busca ou escolha outra categoria.</p>
    <button class="botao botao--sec" id="limpar" type="button">Limpar filtros</button></div>
</div></main>
<footer id="rodape"></footer>
<script>
(() => {
  const { $, cardProduto } = Koala;
  const params = new URLSearchParams(location.search);
  let cat = params.get("cat") || "";
  $("#q").value = params.get("q") || "";

  const chips = $("#chips");
  [{ slug: "", name: "Todas" }, ...CATS].forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = c.name; b.dataset.slug = c.slug;
    b.addEventListener("click", () => { cat = c.slug; render(); });
    chips.appendChild(b);
  });

  function render() {
    const q = $("#q").value.trim().toLowerCase(), ordem = $("#ordem").value;
    const lista = PRODUCTS.filter(p => (!cat || p.cat === cat) && p.name.toLowerCase().includes(q));
    lista.sort(ordem === "menor" ? (a, b) => a.price - b.price : ordem === "maior" ? (a, b) => b.price - a.price : (a, b) => a.name.localeCompare(b.name, "pt-BR"));
    const grade = $("#grade"); grade.innerHTML = "";
    lista.forEach(p => grade.appendChild(cardProduto(p)));
    $("#vazio").hidden = lista.length > 0;
    $("#contagem").textContent = lista.length + (lista.length === 1 ? " produto" : " produtos");
    chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.slug === cat));
    const c = CATS.find(c => c.slug === cat);
    $("#titulo").textContent = c ? c.name : "Produtos";
    document.title = (c ? c.name : "Produtos") + " – Koala Supermercados";
  }
  $("#q").addEventListener("input", render);
  $("#ordem").addEventListener("change", render);
  $("#limpar").addEventListener("click", () => { cat = ""; $("#q").value = ""; render(); });
  render();
})();
</script>
</body>
</html>
